<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Sub Alert Overlay</title>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        font-family: "Segoe UI", Arial, sans-serif;
      }

      #alert-box {
        position: absolute;
        top: 30%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0.8);
        opacity: 0;
        text-align: center;
        color: #fff;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
        transition:
          opacity 0.35s ease,
          transform 0.35s ease;
        pointer-events: none;
      }

      #alert-box.show {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }

      #alert-box .headline {
        font-size: 48px;
        font-weight: 800;
        letter-spacing: 1px;
      }

      #alert-box .username {
        color: #a970ff;
      }

      #alert-box .message {
        margin-top: 10px;
        font-size: 24px;
        font-weight: 400;
        max-width: 700px;
      }
    </style>
  </head>
  <body>
    <div id="alert-box">
      <div class="headline">
        <span class="username" id="alert-user"></span>
        <span id="headline-text">just subscribed!</span>
      </div>
      <div class="message" id="alert-message"></div>
    </div>

    <audio id="alert-sound-sub" src="sub_alert.mp3" preload="auto"></audio>

    <audio id="alert-sound-resub" src="resub_alert.mp3" preload="auto"></audio>

    <audio
      id="alert-sound-giftsub"
      src="giftsub_alert.mp3"
      preload="auto"
    ></audio>

    <audio
      id="alert-sound-giftbomb"
      src="giftsub_alert.mp3"
      preload="auto"
    ></audio>

    <audio id="alert-sound-tip" src="tip_alert.mp3" preload="auto"></audio>

    <audio
      id="alert-sound-kofisub"
      src="kofi_sub_alert.mp3"
      preload="auto"
    ></audio>

    <audio
      id="alert-sound-kofiresub"
      src="kofi_resub_alert.mp3"
      preload="auto"
    ></audio>

    <audio id="alert-sound-error" src="error_alert.mp3" preload="auto"></audio>

    <audio
      id="alert-sound-unknown"
      src="unknown_alert.mp3"
      preload="auto"
    ></audio>

    <script>
      // ---- CONFIG ----
      const WS_HOST = "127.0.0.1";
      const WS_PORT = 52001;
      const WS_ENDPOINT = "/";
      const ALERT_DISPLAY_MS = 7000;
      const TTS_VOLUME = 0.8;
      const TTS_RATE = 1.0;
      const SOUND_VOLUME = 1.0; // 0.0 - 1.0
      // ----------------
      const soundSubEl = document.getElementById("alert-sound-sub");
      const soundResubEl = document.getElementById("alert-sound-resub");
      const soundGiftsubEl = document.getElementById("alert-sound-giftsub");
      const soundGiftbombEl = document.getElementById("alert-sound-giftbomb");
      const soundTipEl = document.getElementById("alert-sound-tip");
      const soundKofisubEl = document.getElementById("alert-sound-kofisub");
      const soundKofiresubEl = document.getElementById("alert-sound-kofiresub");
      const soundErrorEl = document.getElementById("alert-sound-error");
      const soundUnknownEl = document.getElementById("alert-sound-unknown");
      const allSounds = [
        soundSubEl,
        soundResubEl,
        soundGiftsubEl,
        soundGiftbombEl,
        soundTipEl,
        soundKofisubEl,
        soundKofiresubEl,
        soundErrorEl,
        soundUnknownEl,
      ];

      allSounds.forEach((el) => {
        el.volume = SOUND_VOLUME;
      });

      let pendingMessage = null;
      const failedSounds = new Set();

      allSounds.forEach((el) => {
        el.addEventListener("error", () => {
          console.log("[overlay] failed to load sound:", el.src);
          failedSounds.add(el);
        });
      });

      function onSoundEnded() {
        if (pendingMessage) {
          speak(pendingMessage);
          pendingMessage = null;
        }
      }

      allSounds.forEach((el) => {
        el.addEventListener("ended", onSoundEnded);
      });

      const alertBox = document.getElementById("alert-box");
      const userEl = document.getElementById("alert-user");
      const msgEl = document.getElementById("alert-message");
      const headlineText = document.getElementById("headline-text");

      let queue = [];
      let playing = false;

      function connect() {
        const ws = new WebSocket(`ws://${WS_HOST}:${WS_PORT}${WS_ENDPOINT}`);

        ws.onopen = () => {
          console.log("[overlay] connected to Streamer.bot, subscribing...");
          ws.send(
            JSON.stringify({
              request: "Subscribe",
              id: "sub-alert-overlay",
              events: {
                General: ["Custom"],
              },
            }),
          );
        };

        ws.onmessage = (evt) => {
          let msg;
          try {
            msg = JSON.parse(evt.data);
          } catch (e) {
            return; // not JSON, ignore
          }
          // Ignore the subscribe confirmation response and any other non-event messages
          if (
            !msg.event ||
            msg.event.source !== "General" ||
            msg.event.type !== "Custom"
          ) {
            return;
          }
          // Actual broadcasted payload lives here
          let payload;
          try {
            payload =
              typeof msg.data === "string" ? JSON.parse(msg.data) : msg.data;
          } catch (e) {
            return;
          }
          if (
            payload &&
            (payload.event === "subAlert" || payload.event === "tipAlert")
          ) {
            queue.push(payload);
            processQueue();
          }
        };

        ws.onclose = () => {
          console.log("[overlay] disconnected, retrying in 3s");
          setTimeout(connect, 3000);
        };

        ws.onerror = () => ws.close();
      }

      function processQueue() {
        if (playing || queue.length === 0) return;
        playing = true;
        const item = queue.shift();
        showAlert(item);
      }

      function showAlert(item) {
        userEl.textContent = item.user || "Someone";
        msgEl.textContent = item.message || "";
        let soundEl;

        switch (item.kind) {
          case "sub":
            headlineText.textContent = "just subscribed!";
            soundEl = soundSubEl;
            break;

          case "resub":
            headlineText.textContent =
              "resubscribed for " + (item.months || "?") + " months!";
            soundEl = soundResubEl;
            break;

          case "giftsub":
            headlineText.textContent =
              "gifted a sub to " + (item.recipient || "someone") + "!";
            soundEl = soundGiftsubEl;
            break;

          case "giftbomb":
            headlineText.textContent =
              "gifted " +
              (item.giftCount || "?") +
              " subs to a buncha wild animals!";
            soundEl = soundGiftbombEl;
            break;

          case "tip":
            headlineText.textContent =
              "tipped " +
              (item.amount || "?") +
              " " +
              (item.currency || "") +
              "!";
            soundEl = soundTipEl;
            break;

          case "kofisub":
            headlineText.textContent =
              "subscribed via Ko-fi for " +
              (item.amount || "?") +
              " " +
              (item.currency || "") +
              " Monthly !";
            soundEl = soundKofisubEl;
            break;

          case "kofiresub":
            headlineText.textContent =
              "renewed their Ko-fi membership for " +
              (item.amount || "?") +
              " " +
              (item.currency || "") +
              " Monthly !";
            soundEl = soundKofiresubEl;
            break;

          default:
            headlineText.textContent =
              "triggered an alert I've improperly coded XD";
            soundEl = soundUnknownEl;
        }

        alertBox.classList.add("show");

        if (failedSounds.has(soundEl) && soundEl !== soundErrorEl) {
          console.log(
            "[overlay] sound failed to load previously, using error sound instead:",
            soundEl.src,
          );
          soundEl = soundErrorEl;
        }

        soundEl.currentTime = 0;
        soundEl.play().catch(() => {}); // ignore autoplay-block errors
        pendingMessage = item.message || null;
        setTimeout(() => {
          alertBox.classList.remove("show");
          setTimeout(() => {
            playing = false;
            processQueue();
          }, 700);
        }, ALERT_DISPLAY_MS);
      }

      function speak(text) {
        if (!("speechSynthesis" in window)) return;
        const utter = new SpeechSynthesisUtterance(text);
        utter.volume = TTS_VOLUME;
        utter.rate = TTS_RATE;
        window.speechSynthesis.speak(utter);
      }

      connect();
    </script>
  </body>
</html>
