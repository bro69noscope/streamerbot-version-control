<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Twitch Sub Alert Overlay</title>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        font-family: "Segoe UI", Arial, sans-serif;
      }

      #alert-box {
        position: absolute;
        top: 30%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0.8);
        opacity: 0;
        text-align: center;
        color: #fff;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
        transition:
          opacity 0.35s ease,
          transform 0.35s ease;
        pointer-events: none;
      }

      #alert-box.show {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }

      #alert-box .headline {
        font-size: 48px;
        font-weight: 800;
        letter-spacing: 1px;
      }

      #alert-box .username {
        color: #a970ff;
      }

      #alert-box .message {
        margin-top: 10px;
        font-size: 24px;
        font-weight: 400;
        max-width: 700px;
      }
    </style>
  </head>
  <body>
    <div id="alert-box">
      <div class="headline">
        <span class="username" id="alert-user"></span>
        <span id="headline-text">just subscribed!</span>
      </div>
      <div class="message" id="alert-message"></div>
    </div>

    <audio id="alert-sound-sub" src="sub_alert.mp3" preload="auto"></audio>
    <audio id="alert-sound-resub" src="resub_alert.mp3" preload="auto"></audio>
    <audio
      id="alert-sound-giftsub"
      src="giftsub_alert.mp3"
      preload="auto"
    ></audio>
    <audio
      id="alert-sound-giftbomb"
      src="giftsub_alert.mp3"
      preload="auto"
    ></audio>

    <script src="alerts-constants.js"></script>
    <script src="alerts-common.js"></script>
    <script>
      const soundSubEl = document.getElementById("alert-sound-sub");
      const soundResubEl = document.getElementById("alert-sound-resub");
      const soundGiftsubEl = document.getElementById("alert-sound-giftsub");
      const soundGiftbombEl = document.getElementById("alert-sound-giftbomb");

      createAlertOverlay({
        name: "twitch",
        subscribedEvents: ["TwitchsubAlert"],
        ownSounds: [soundSubEl, soundResubEl, soundGiftsubEl, soundGiftbombEl],

        getAlertDisplay(item) {
          switch (item.kind) {
            case "sub":
              return { headline: "just subscribed!", soundEl: soundSubEl };

            case "resub":
              return {
                headline:
                  "resubscribed for " + (item.months || "?") + " months!",
                soundEl: soundResubEl,
              };

            case "giftsub":
              return {
                headline:
                  "gifted a sub to " + (item.recipient || "someone") + "!",
                soundEl: soundGiftsubEl,
              };

            case "giftbomb":
              return {
                headline:
                  "gifted " +
                  (item.giftCount || "?") +
                  " subs to a buncha wild animals!",
                soundEl: soundGiftbombEl,
              };

            // "unknown" (sent explicitly by the C# sub-action) and any
            // other unrecognized kind both fall through here, to the same
            // shared "unknown" headline/sound.
            default:
              return null;
          }
        },
      });
    </script>
  </body>
</html>
